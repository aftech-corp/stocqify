; Stocqify — production PHP settings for Hostinger
; This file is read by Hostinger shared hosting to override PHP defaults.

; ── Error handling (hide errors from visitors) ───────────────────────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; ── Performance ──────────────────────────────────────────────────────────────
max_execution_time = 60
max_input_vars = 3000
memory_limit = 256M
post_max_size = 20M
upload_max_filesize = 10M

; ── Session ──────────────────────────────────────────────────────────────────
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
